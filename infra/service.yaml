AWSTemplateFormatVersion: '2010-09-09'
Description: Generic ECS Fargate microservice - deployed once per service as stack svc-<name>

Parameters:
  ServiceName:          { Type: String, Description: 'e.g. users, orders' }
  PathPattern:          { Type: String, Description: 'ALB path, e.g. /users' }
  ListenerRulePriority: { Type: Number, Description: Unique per service }
  ContainerPort:        { Type: Number, Default: 3000 }
  TaskCpu:              { Type: String, Default: '256' }
  TaskMemory:           { Type: String, Default: '512' }
  DesiredCount:         { Type: Number, Default: 2 }
  MinCapacity:          { Type: Number, Default: 2 }
  MaxCapacity:          { Type: Number, Default: 6 }
  CpuTarget:            { Type: Number, Default: 60 }
  # shared infra (outputs of the base stack)
  ClusterName:          { Type: String }
  VpcId:                { Type: AWS::EC2::VPC::Id }
  TaskSubnets:          { Type: List<AWS::EC2::Subnet::Id> }
  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
  AlbListenerArn:       { Type: String }
  AlbSecurityGroupId:   { Type: AWS::EC2::SecurityGroup::Id }
  ServicesSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  ServiceConnectNamespaceArn: { Type: String }
  # image
  EcrRepoUri:           { Type: String }
  ImageTag:             { Type: String, Default: latest }

Resources:
  # ---------- Secret: one per service, created once, kept if the stack is deleted ----------
  # The whole JSON is injected as APP_SECRETS, so new keys can be added in the console
  # without changing this template (just force a new deployment afterwards).
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ServiceName}/app'
      Description: !Sub 'Credentials for ${ServiceName}'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"db_user":"${ServiceName}_user"}'
        GenerateStringKey: db_password
        PasswordLength: 32
        ExcludePunctuation: true

  # ---------- IAM ----------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-own-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret      # each service can read ONLY its own secret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ServiceName}'
      RetentionInDays: 14

  # ---------- Task definition ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Sub '${EcrRepoUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - Name: http
              ContainerPort: !Ref ContainerPort
              AppProtocol: http
          Environment:
            - { Name: NODE_ENV,     Value: production }
            - { Name: PORT,         Value: !Ref ContainerPort }
            - { Name: BASE_PATH,    Value: !Ref PathPattern }
            - { Name: SERVICE_NAME, Value: !Ref ServiceName }
          Secrets:
            - Name: APP_SECRETS          # full JSON of the secret, parsed in src/config.js
              ValueFrom: !Ref AppSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref ServiceName

  # ---------- Networking ----------
  ServiceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ServiceName} - traffic from ALB'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroupId

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: !Sub '${PathPattern}/health'
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: [!Ref PathPattern, !Sub '${PathPattern}/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref TaskSubnets
          SecurityGroups: [!Ref ServiceSG, !Ref ServicesSecurityGroupId]
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      # Other services call this one at http://<ServiceName>:<ContainerPort>
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ServiceConnectNamespaceArn
        Services:
          - PortName: http
            DiscoveryName: !Ref ServiceName
            ClientAliases:
              - Port: !Ref ContainerPort
                DnsName: !Ref ServiceName

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${ClusterName}/${Service.Name}'
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ServiceName}-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTarget
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  ServiceName: { Value: !GetAtt Service.Name }
  SecretName:  { Value: !Sub '${ServiceName}/app' }
